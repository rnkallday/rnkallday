<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Published Work — RNK</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Parkinsans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ========================
           PUBLISHED — SCRAPBOOK
        ======================== */

        body {
            background-color: #4a9ec5;
            background-image: url('assets/images/notebook-bg.png');
            background-size: cover;
            background-position: center top;
            background-attachment: fixed;
            background-repeat: no-repeat;
            min-height: 100vh;
        }

        /* Page header */
        .page-header {
            text-align: center;
            padding: 6rem 1.5rem 2rem;
        }

        .page-header h1 {
            font-family: 'Parkinsans', sans-serif;
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 800;
            color: #1a1a1a;
            margin-bottom: 0.5rem;
            text-decoration: underline;
            text-decoration-color: rgba(0, 0, 0, 0.15);
            text-underline-offset: 6px;
        }

        .page-header p {
            font-family: 'Parkinsans', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            color: #444;
        }

        /* ===== SCRAPBOOK GRID ===== */
        .scrapbook {
            display: grid;
            grid-template-columns: 1fr 1fr;
            max-width: 880px;
            margin: 0 auto;
            padding: 1rem 3rem 4rem;
            gap: 3rem;
        }

        /* ===== PHOTO CARDS ===== */
        .scrapbook-photo {
            background: #fff;
            padding: 10px 10px 0;
            box-shadow: 3px 4px 14px rgba(0, 0, 0, 0.22);
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .scrapbook-photo a {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .scrapbook-photo img {
            width: 100%;
            display: block;
        }

        /* Rotations — scrapbook feel */
        .scrapbook-photo:nth-child(1) { transform: rotate(-2.5deg); }
        .scrapbook-photo:nth-child(2) { transform: rotate(1.8deg); }
        .scrapbook-photo:nth-child(3) { transform: rotate(1.2deg); }
        .scrapbook-photo:nth-child(4) { transform: rotate(-1.5deg); }

        .scrapbook-photo:hover {
            transform: rotate(0deg) scale(1.06) !important;
            z-index: 10;
            box-shadow: 5px 8px 28px rgba(0, 0, 0, 0.3);
        }

        /* ===== TAPE STRIPS ===== */
        .scrapbook-photo::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%) rotate(1deg);
            width: 72px;
            height: 22px;
            background: rgba(220, 215, 175, 0.55);
            border: 1px solid rgba(200, 195, 155, 0.25);
            z-index: 3;
            pointer-events: none;
        }

        .scrapbook-photo:nth-child(2)::before {
            transform: translateX(-50%) rotate(-2deg);
            background: rgba(175, 210, 200, 0.5);
            border-color: rgba(155, 195, 185, 0.25);
        }

        .scrapbook-photo:nth-child(3)::before {
            transform: translateX(-50%) rotate(0.5deg);
            width: 66px;
            background: rgba(210, 185, 200, 0.5);
            border-color: rgba(195, 170, 185, 0.25);
        }

        .scrapbook-photo:nth-child(4)::before {
            transform: translateX(-50%) rotate(-1deg);
            background: rgba(195, 215, 175, 0.5);
            border-color: rgba(180, 200, 160, 0.25);
        }

        /* ===== CAPTIONS ===== */
        .scrapbook-caption {
            padding: 10px 4px 14px;
            text-align: center;
        }

        .scrapbook-pub {
            font-family: 'Parkinsans', sans-serif;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: #999;
            margin-bottom: 3px;
        }

        .scrapbook-title {
            font-family: 'Parkinsans', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            color: #1a1a1a;
            line-height: 1.3;
        }

        /* ===== BACK LINK ===== */
        .back-link-wrapper {
            max-width: 880px;
            margin: 0 auto;
            padding: 0 3rem 4rem;
        }

        .back-link {
            display: inline-block;
            font-family: 'Parkinsans', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            color: #1a1a1a;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.6);
            padding: 6px 14px;
            border-radius: 4px;
            transition: background 0.3s ease;
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.9);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 700px) {
            .scrapbook {
                grid-template-columns: 1fr;
                max-width: 360px;
                padding: 1rem 1.5rem 3rem;
                gap: 2.5rem;
            }

            .page-header {
                padding: 5rem 1rem 1.5rem;
            }

            .back-link-wrapper {
                padding: 0 1.5rem 3rem;
            }
        }
    </style>
</head>
<body>

            <ul class="nav-links">

        <!-- BACK LINK -->
